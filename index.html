    <script>
      // Suppress harmless Vite HMR WebSocket connection notices in Cloud Run / iframe environment
      (function() {
        const RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function MockWebSocket(url, protocols) {
            const urlStr = String(url || '');
            if (!urlStr.includes('vite') && !urlStr.includes('ais-dev') && !urlStr.includes('/@vite') && !urlStr.includes('run.app')) {
              try {
                return new RealWebSocket(url, protocols);
              } catch (_) {}
            }

            const listeners = {};
            const self = this instanceof MockWebSocket ? this : Object.create(MockWebSocket.prototype);
            self.readyState = 1; // OPEN
            self.url = urlStr;
            self.protocol = '';
            self.extensions = '';
            self.bufferedAmount = 0;
            self.binaryType = 'blob';
            self.send = function() {};
            self.close = function() {};
            self.addEventListener = function(event, handler) {
              if (!listeners[event]) listeners[event] = [];
              listeners[event].push(handler);
              if (event === 'open') {
                setTimeout(() => {
                  try { handler.call(self, { type: 'open', target: self }); } catch (_) {}
                }, 0);
              }
            };
            self.removeEventListener = function(event, handler) {
              if (listeners[event]) {
                listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
              }
            };
            self.dispatchEvent = function() { return true; };

            setTimeout(() => {
              if (typeof self.onopen === 'function') {
                try { self.onopen({ type: 'open', target: self }); } catch (_) {}
              }
            }, 0);

            return self;
          }

          MockWebSocket.prototype = RealWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          window.WebSocket = MockWebSocket;
        }

        const origError = console.error;
        console.error = function(...args) {
          const isViteWs = args.some(arg => {
            if (!arg) return false;
            const str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
            return str.includes('WebSocket closed without opened') ||
                   (str.includes('[vite]') && (str.includes('connect failed') || str.includes('WebSocket') || str.includes('closed without opened'))) ||
                   str.includes('failed to connect to websocket') ||
                   str.includes('WebSocket connection to');
          });
          if (isViteWs) return;
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          const isViteWs = args.some(arg => {
            if (!arg) return false;
            const str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg));
            return str.includes('WebSocket closed without opened') ||
                   (str.includes('[vite]') && (str.includes('connect failed') || str.includes('WebSocket')));
          });
          if (isViteWs) return;
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          const msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (typeof msg === 'string' && (msg.includes('WebSocket closed without opened') || msg.includes('[vite]'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          const reason = (e && (e.reason && (e.reason.message || e.reason.stack || String(e.reason)))) || '';
          if (typeof reason === 'string' && (reason.includes('WebSocket closed without opened') || reason.includes('[vite]'))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
